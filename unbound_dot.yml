---
# Everything in a single playbook to configure a unbound DoT server
# on Debian 12

- hosts: unbound
  vars:
    # User created for sudo and ssh key access
    admin_user: operator
    # SSH key to use for admin_user
    ssh_key: "{{ lookup('file', '~/.ssh/id_your_key.pub') }}"
    # Hostname to use for the TLS cert, must be a FQDN also used for the certname and the apparmour profile update
    hostname: "{{ inventory_hostname }}"

  tasks:
    - import_tasks: tasks/disable_ipv6.yml
      tags: ipv6
    - import_tasks: tasks/nftables_tasks.yml
      tags: nftables
    - import_tasks: tasks/sysadmin_tasks.yml
      tags: sysadmin
    - import_tasks: tasks/letsencrypt_tasks.yml
      tags: letsencrypt

    - name: Install unbound
      package:
        name: unbound

    - name: "Ansible | Print a variable"
      tags: debug
      debug:
        msg: |
          "ncpu = {{ ansible_processor_nproc }}"
          "vcpus = {{ ansible_processor_vcpus }}"

    # The distribution app armour profile does not allow access to the letsencrypt certs
    - name: Install unbound apparmor local profile
      tags: unbound
      notify: Restart apparmor
      template:
        src: files/apparmor.conf.j2
        dest: /etc/apparmor.d/local/usr.sbin.unbound
        owner: root
        group: root
        mode: '0644'

    - name: Install unbound.conf
      tags: unbound
      notify: Restart unbound
      template:
        src: files/unbound-dot.conf.j2
        dest: /etc/unbound/unbound.conf.d/unbound-dot.conf
        # TODO fix this validate.  It will always fail until the service is
        # started for the first time when the unbound_control keys that are
        # reference in the config file are created.
        validate: unbound-checkconf %s
        owner: root
        group: unbound
        mode: '0644'

    - name: Enable unbound
      tags: unbound
      service:
        name: unbound
        state: started
        enabled: yes

    # - name: Add operator to admin groups
    #   user:
    #     name: "{{ admin_user }}"
    #     append: yes
    #     groups: unbound

    # - name: Create group for remote-control users
    #   group:
    #     name: unbound-control

    # - name: Set permissions for remote-control keys to remote-control group
    #   file:
    #     path: "{{ item }}"
    #     owner: root
    #     group: unbound-control
    #     mode: 0640
    #   loop:
    #     - /etc/unbound/unbound_control.key
    #     - /etc/unbound/unbound_control.pem
    #     - /etc/unbound/unbound_server.pem

    # - import_tasks: tasks/datadog_tasks.yml
    #   tags: datadog

  handlers:
    - name: Restart unbound
      service:
        name: unbound
        state: restarted

    - name: Restart sshd
      service:
        name: sshd
        state: restarted

    - name: Restart nftables
      service:
        name: nftables
        state: restarted

    - name: Restart apparmor
      service:
        name: apparmor
        state: reloaded
